name: uneXpected v8 live health smoke

on:
  push:
    branches: [feature/unified-v8-consolidation]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-health:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify unified service health and owner boundary
        env:
          UNEXPECTED_V8_HEALTH_URL: https://unexpected-v8-unified-test.onrender.com
        run: python tools/live_health_smoke.py
