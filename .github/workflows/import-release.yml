name: Import verified uneXpected v7.3.1 release

on:
  push:
    branches:
      - release/v7.3.1-trusted-approval-verifier
    paths:
      - release-source/uneXpected_v7.3.1_governed_runtime.zip

permissions:
  contents: read

jobs:
  verify-archive:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/v7.3.1-trusted-approval-verifier
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify archive checksum and ZIP integrity
        run: |
          set -euo pipefail
          ARCHIVE=release-source/uneXpected_v7.3.1_governed_runtime.zip
          EXPECTED=4dad792982ac021a3c3e9337aad78ea46e134469410b4c0d05b9112ed0b00e1c
          ACTUAL=$(sha256sum "$ARCHIVE" | awk '{print $1}')
          test "$ACTUAL" = "$EXPECTED"
          unzip -tq "$ARCHIVE"
          echo "Verified SHA-256 $ACTUAL"
      - name: Run full tests and compile checks
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          import compileall, os, subprocess, sys, tempfile
          archive = Path('release-source/uneXpected_v7.3.1_governed_runtime.zip').resolve()
          target = Path(tempfile.mkdtemp(prefix='unexpected-v731-'))
          with ZipFile(archive) as z:
              if z.testzip():
                  raise SystemExit('ZIP integrity failure')
              z.extractall(target)
          roots = [p for p in target.iterdir() if p.is_dir() and p.name == 'uneXpected_v7']
          if len(roots) != 1:
              raise SystemExit(f'Expected one uneXpected_v7 root, found {len(roots)}')
          root = roots[0]
          env = dict(os.environ)
          env['UNEXPECTED_PACKAGE_ZIP'] = str(archive)
          if not compileall.compile_dir(str(root / 'unexpected_runtime'), quiet=1):
              raise SystemExit('Runtime compilation failed')
          result = subprocess.run([sys.executable, '-m', 'unittest', 'discover', '-s', 'tests', '-v'],
                                  cwd=root, env=env)
          if result.returncode:
              raise SystemExit(result.returncode)
          for command in (['status'], ['list'], ['eval']):
              result = subprocess.run([sys.executable, '-m', 'unexpected_runtime.cli', *command],
                                      cwd=root, env=env)
              if result.returncode:
                  raise SystemExit(result.returncode)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: verified-uneXpected-v7.3.1-package
          path: release-source/uneXpected_v7.3.1_governed_runtime.zip
          if-no-files-found: error
          retention-days: 7

  create-source-pull-request:
    needs: verify-archive
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/download-artifact@v4
        with:
          name: verified-uneXpected-v7.3.1-package
          path: ${{ runner.temp }}/verified-package
      - name: Independently verify artifact and extract release
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          import hashlib, os
          archive = Path(os.environ['RUNNER_TEMP']) / 'verified-package' / 'uneXpected_v7.3.1_governed_runtime.zip'
          expected = '4dad792982ac021a3c3e9337aad78ea46e134469410b4c0d05b9112ed0b00e1c'
          if not archive.is_file() or hashlib.sha256(archive.read_bytes()).hexdigest() != expected:
              raise SystemExit('Downloaded artifact SHA-256 mismatch')
          target = Path(os.environ['RUNNER_TEMP']) / 'unpacked'
          with ZipFile(archive) as z:
              if z.testzip():
                  raise SystemExit('Downloaded archive failed ZIP integrity test')
              z.extractall(target)
          source = target / 'uneXpected_v7'
          if not (source / 'agent_manifest.json').is_file():
              raise SystemExit('Expected manifest missing from release archive')
          os.environ['UNEXPECTED_RELEASE_SOURCE'] = str(source)
          PY
      - name: Import source on an integration branch and open PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          from pathlib import Path
          import os, shutil, subprocess
          source = Path(os.environ['RUNNER_TEMP']) / 'unpacked' / 'uneXpected_v7'
          workspace = Path.cwd()
          for child in workspace.iterdir():
              if child.name == '.git':
                  continue
              if child.is_dir():
                  shutil.rmtree(child)
              else:
                  child.unlink()
          shutil.copytree(source, workspace, dirs_exist_ok=True)
          subprocess.run(['git','config','user.name','github-actions[bot]'],check=True)
          subprocess.run(['git','config','user.email','41898282+github-actions[bot]@users.noreply.github.com'],check=True)
          subprocess.run(['git','switch','-c','integration/v7.3.1-governed-runtime'],check=True)
          subprocess.run(['git','add','-A'],check=True)
          subprocess.run(['git','commit','-m','feat: integrate uneXpected v7.3.1 governed runtime'],check=True)
          subprocess.run(['git','push','origin','HEAD:refs/heads/integration/v7.3.1-governed-runtime'],check=True)
          subprocess.run(['gh','pr','create','--repo',os.environ['GITHUB_REPOSITORY'],'--base','main',
                          '--head','integration/v7.3.1-governed-runtime',
                          '--title','Integrate uneXpected v7.3.1 governed runtime',
                          '--body','Imported from the checksum-verified v7.3.1 package. The preceding isolated, read-only job runs archive checks, compilation, the full unit suite and CLI smoke checks. This PR is for independent review only; it is not merged or deployed.'],check=True)
          PY
      - name: Remove temporary transfer branch
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: git push origin --delete release/v7.3.1-trusted-approval-verifier
