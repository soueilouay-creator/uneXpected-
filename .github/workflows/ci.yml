name: uneXpected runtime CI

on:
  pull_request:
  push:
    branches: [main, project/trading-intelligence-v0.1.0, project/trading-engine-v0.2.0]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile runtime
        run: python -m compileall -q unexpected_runtime trading_engine
      - name: Build package integrity fixture
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZIP_DEFLATED, ZipFile
          root = Path.cwd()
          target = Path(__import__('os').environ['RUNNER_TEMP']) / 'uneXpected_v7.3.1_governed_runtime.zip'
          with ZipFile(target, 'w', ZIP_DEFLATED) as archive:
              for path in sorted(root.rglob('*')):
                  if not path.is_file() or '__pycache__' in path.parts or path.suffix in {'.pyc', '.sqlite3', '.db'}:
                      continue
                  relative = path.relative_to(root)
                  if any(part in {'.git', '.venv', 'venv', 'state'} for part in relative.parts):
                      continue
                  if relative.name == '.env' or (relative.name.startswith('.env.') and relative.name != '.env.example'):
                      continue
                  archive.write(path, Path('uneXpected_v7') / relative)
          print(f'Built {target} ({target.stat().st_size} bytes)')
          PY
          echo "UNEXPECTED_PACKAGE_ZIP=$RUNNER_TEMP/uneXpected_v7.3.1_governed_runtime.zip" >> "$GITHUB_ENV"
      - name: Print trading v0.2.0 file digests for manifest refresh
        run: |
          python - <<'PY'
          import hashlib
          from pathlib import Path
          paths = [
              '.github/workflows/ci.yml', '.env.example', 'DEPLOY.md', 'README.md',
              'FILE_INVENTORY_SHA256.txt', 'skill_manifest.json', 'skills/trading-ops/WORKFLOW.md',
              'workflow_profiles/trading-ops.md', 'tests/test_structure.py',
              'tests/test_trading_package.py', 'tests/test_trading_engine.py',
              'trading/README.md', 'trading/config/paper.example.json',
              'trading_engine/__init__.py', 'trading_engine/models.py', 'trading_engine/data.py',
              'trading_engine/risk.py', 'trading_engine/scanner.py', 'trading_engine/backtest.py',
              'trading_engine/portfolio.py', 'trading_engine/service.py',
              'unexpected_runtime/cli.py', 'unexpected_runtime/http_api.py',
              'unexpected_runtime/trading_api.py',
              'docs/specs/2026-11-01-trading-engine-v0.2.0.md',
              'docs/plans/2026-11-01-trading-engine-v0.2.0-implementation-plan.md',
          ]
          for rel in paths:
              path = Path(rel)
              if path.is_file():
                  print(f"V020_SHA256 {hashlib.sha256(path.read_bytes()).hexdigest()}  {rel}")
          PY
      - name: Run full regression suite
        run: python -m unittest discover -s tests -v
      - name: CLI smoke tests
        run: |
          python -m unexpected_runtime.cli status
          python -m unexpected_runtime.cli list
          python -m unexpected_runtime.cli eval
          python -m unexpected_runtime.cli trading health
          python -m unexpected_runtime.cli trading scan --symbols DEMO
          python -m unexpected_runtime.cli trading backtest DEMO --initial-cash 10000
