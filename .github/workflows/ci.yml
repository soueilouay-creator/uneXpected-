name: uneXpected v8 command center CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime-tests:
    runs-on: ubuntu-latest
    env:
      TEST_POSTGRES_DSN: postgresql://unexpected:test-password@localhost:5432/unexpected_test
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: unexpected
          POSTGRES_PASSWORD: test-password
          POSTGRES_DB: unexpected_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U unexpected -d unexpected_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install runtime dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt
      - name: Compile runtime
        run: python -m compileall -q unexpected_runtime
      - name: Apply PostgreSQL migrations to ephemeral CI database
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          import psycopg
          dsn = os.environ["TEST_POSTGRES_DSN"]
          with psycopg.connect(dsn, autocommit=True) as connection:
              for migration in sorted(Path("migrations").glob("*.sql")):
                  connection.execute(migration.read_text(encoding="utf-8"), prepare=False)
                  print(f"Applied {migration}")
          PY
      - name: Build v8 source integrity fixture
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZIP_DEFLATED, ZipFile
          import os
          root = Path.cwd()
          target = Path(os.environ['RUNNER_TEMP']) / 'uneXpected_v8_command_center.zip'
          with ZipFile(target, 'w', ZIP_DEFLATED) as archive:
              for path in sorted(root.rglob('*')):
                  if not path.is_file() or '__pycache__' in path.parts or path.suffix in {'.pyc', '.sqlite3', '.db'}:
                      continue
                  relative = path.relative_to(root)
                  if any(part in {'.git', '.venv', 'venv', 'state'} for part in relative.parts):
                      continue
                  if relative.name == '.env' or (relative.name.startswith('.env.') and relative.name != '.env.example'):
                      continue
                  archive.write(path, Path('uneXpected_v8') / relative)
          print(f'Built {target} ({target.stat().st_size} bytes)')
          PY
          echo "UNEXPECTED_PACKAGE_ZIP=$RUNNER_TEMP/uneXpected_v8_command_center.zip" >> "$GITHUB_ENV"
      - name: Run regression and security suite
        run: python -m unittest discover -s tests -v
      - name: Build single-process Docker image
        run: docker build --pull -t unexpected-v8-command-center:ci .
      - name: CLI smoke tests
        run: |
          python -m unexpected_runtime.cli status
          python -m unexpected_runtime.cli list
          python -m unexpected_runtime.cli eval
