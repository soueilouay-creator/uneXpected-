name: uneXpected runtime CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned runtime dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Compile runtime
        run: python -m compileall -q unexpected_runtime tests
      - name: Build package integrity fixture
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZIP_DEFLATED, ZipFile
          root = Path.cwd()
          target = Path(__import__('os').environ['RUNNER_TEMP']) / 'uneXpected_v7.3.1_governed_runtime.zip'
          with ZipFile(target, 'w', ZIP_DEFLATED) as archive:
              for path in sorted(root.rglob('*')):
                  if not path.is_file() or '__pycache__' in path.parts or path.suffix in {'.pyc', '.sqlite3', '.db'}:
                      continue
                  relative = path.relative_to(root)
                  if any(part in {'.git', '.venv', 'venv', 'state'} for part in relative.parts):
                      continue
                  if relative.name == '.env' or (relative.name.startswith('.env.') and relative.name != '.env.example'):
                      continue
                  archive.write(path, Path('uneXpected_v7') / relative)
          print(f'Built {target} ({target.stat().st_size} bytes)')
          PY
          echo "UNEXPECTED_PACKAGE_ZIP=$RUNNER_TEMP/uneXpected_v7.3.1_governed_runtime.zip" >> "$GITHUB_ENV"
      - name: Run regression suite
        run: python -m unittest discover -s tests -v
      - name: Prepare immutable Docker test image
        run: |
          docker pull --platform linux/amd64 python:3.12-slim-bookworm
          image_ref="$(docker image inspect --format='{{index .RepoDigests 0}}' python:3.12-slim-bookworm)"
          case "$image_ref" in
            *@sha256:*) ;;
            *) echo "Docker did not return an immutable image digest"; exit 1 ;;
          esac
          echo "UNEXPECTED_TEST_DOCKER_IMAGE=$image_ref" >> "$GITHUB_ENV"
      - name: Run real-source and isolated-sandbox lifecycle
        env:
          UNEXPECTED_RUN_LIVE_EVIDENCE_INTEGRATION: "1"
          UNEXPECTED_TEST_EXECUTOR: docker
          UNEXPECTED_TEST_WORKSPACE_ROOT: ${{ github.workspace }}
          UNEXPECTED_TEST_TIMEOUT_SECONDS: "180"
          UNEXPECTED_SOURCE_ALLOWED_DOMAINS: docs.python.org
          UNEXPECTED_SOURCE_TIMEOUT_SECONDS: "10"
          UNEXPECTED_SOURCE_MAX_BYTES: "524288"
          UNEXPECTED_SOURCE_MAX_COUNT: "1"
        run: python -m unittest tests.test_evidence_live_lifecycle -v
      - name: CLI smoke tests
        run: |
          python -m unexpected_runtime.cli status
          python -m unexpected_runtime.cli list
          python -m unexpected_runtime.cli eval
